name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tes, format, dan build
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: recipes_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, gd, intl, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Pasang dependensi
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          npm ci

      - name: Build aset
        run: npm run build

      - name: Siapkan .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Cek format kode (Pint)
        run: vendor/bin/pint --test

      - name: Jalankan tes
        run: php artisan test
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_USERNAME: root
          DB_PASSWORD: ''
